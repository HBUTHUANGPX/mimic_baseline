# 中文：默认示例配置。命令行入口只读取该 YAML 并启动训练器。
data:
  # 中文：兼容旧工程 motion_file.yaml；groups 为空时训练全部 motion_group。
  motion_yaml: scripts/rsl_rl/motion_file_mr.yaml
  groups: []

features:
  # 中文：FeatureBuilder 输出 robot/human 单帧特征，不做归一化。
  robot_anchor_body: torso_link
  human_anchor_body: Hips
  human_body_names:
    - Spine1
    - Spine2
    - Chest
    - Neck1
    - Neck2
    - Head
    - HeadEnd
    - LeftShoulder
    - LeftArm
    - LeftForeArm
    - LeftHand
    - RightShoulder
    - RightArm
    - RightForeArm
    - RightHand
    - LeftLeg
    - LeftShin
    - LeftFoot
    - LeftToeBase
    - LeftToeEnd
    - RightLeg
    - RightShin
    - RightFoot
    - RightToeBase
    - RightToeEnd

model:
  # 中文：编码器直接输出 latent_dim，两个编码器共享量化器。
  latent_dim: 64
  robot_encoder_hidden_dims: [1024, 512, 256]
  human_encoder_hidden_dims: [1024, 512, 256]
  decoder_hidden_dims: [256, 512, 1024]
  activation: elu
  quantizer:
    type: ifsq
    levels: 17
    do_simple_bound: true
    act_fun: scale_sigmoid_16
    eps: 0.001

loss:
  # 中文：四项 MSE 的权重。
  robot_recon: 1.0
  human_recon: 1.0
  latent_align: 0.25
  cycle_latent: 0.25

train:
  # 中文：每个 epoch 使用全量合法中心帧池，无放回随机打乱。
  device: cuda
  epochs: 10000
  batch_size: 8192
  learning_rate: 0.0003
  weight_decay: 0.0001
  history: 0
  future: 9
  seed: 42
  log_every_steps: 20
  log_histograms: true
  progress: true
  checkpoint_interval_epochs: 10
  normalizer_eps: 0.01

output:
  # 中文：训练输出包含 checkpoints/latest.pt、周期 checkpoint 和 TensorBoard 日志。
  root_dir: outputs/motion_reconstruction
  run_name:
