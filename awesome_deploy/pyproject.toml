[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome_deploy"
version = "0.1.0"
description = "Awesome Deploy 工具包，用于 mimic_baseline 项目"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]

[tool.setuptools.packages.find]
where = ["."]
include = ["awesome_deploy*"]
namespaces = false

[tool.setuptools]
include-package-data = true