version: 1

inputs:
  actor_obs:
    source_kind: state
    source_key: actor_obs
    transform: as_batch_vector

  actor_fsq_obs:
    source_kind: state
    source_key: actor_fsq_obs
    transform: as_batch_vector

outputs:
  actions:
    target_kind: primary
    target_key: policy_action
    transform: flatten_float32

buffer_initializers:
  action:
    init_kind: zeros_from_output
    tensor_name: actions
    axis: 1

per_step_buffer_updates:
  action:
    source_kind: result
    source_key: policy_action
